const c=document.querySelector('#map'),ctx=c.getContext('2d'),N=12,S=64;let land=[],showGrid=false;
const isLand=(x,y)=>x>=0&&y>=0&&x<N&&y<N&&land[y][x];
function reset(){land=Array.from({length:N},(_,y)=>Array.from({length:N},(_,x)=>{let dx=(x-5.5)/5.2,dy=(y-5.5)/5.2;return dx*dx+dy*dy+.16*Math.sin(x*1.3+y*.9)<.96}));draw()}
function random(){land=Array.from({length:N},(_,y)=>Array.from({length:N},(_,x)=>{let dx=(x-5.5)/5.2,dy=(y-5.5)/5.2;return dx*dx+dy*dy+(Math.random()-.5)*.7<.95}));draw()}
function edge(x,y,i){ctx.save();ctx.translate((x+.5)*S,(y+.5)*S);ctx.rotate(i*Math.PI/2);ctx.fillStyle='#d2b071';ctx.fillRect(-S/2,-S/2,S,7);ctx.fillStyle='#8e8465';for(let k=0;k<7;k++){ctx.beginPath();ctx.ellipse(-S/2+k*10+4,-S/2+4,3.5,2.6,0,0,Math.PI*2);ctx.fill()}ctx.strokeStyle='#d5ffff';ctx.lineWidth=3;ctx.beginPath();for(let t=0;t<=64;t+=4){let xx=t-32,yy=-S/2-6+Math.sin(t*.24+x+y)*1.5;t===0?ctx.moveTo(xx,yy):ctx.lineTo(xx,yy)}ctx.stroke();ctx.restore()}
function corner(x,y,i){ctx.save();ctx.translate((x+.5)*S,(y+.5)*S);ctx.rotate(i*Math.PI/2);ctx.fillStyle='#d2b071';ctx.beginPath();ctx.moveTo(-32,-32);ctx.lineTo(-19,-32);ctx.quadraticCurveTo(-19,-19,-32,-19);ctx.closePath();ctx.fill();ctx.strokeStyle='#d5ffff';ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(-32,-32,19,0,Math.PI/2);ctx.stroke();ctx.restore()}
function draw(){if(!grass.complete||!water.complete)return;const gp=ctx.createPattern(grass,'repeat'),wp=ctx.createPattern(water,'repeat');ctx.fillStyle=wp;ctx.fillRect(0,0,768,768);ctx.fillStyle=gp;for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(land[y][x])ctx.fillRect(x*S,y*S,S,S);for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(land[y][x]){let e=[!isLand(x,y-1),!isLand(x+1,y),!isLand(x,y+1),!isLand(x-1,y)];e.forEach((v,i)=>{if(v)edge(x,y,i)});for(let i=0;i<4;i++)if(e[i]&&e[(i+3)%4])corner(x,y,i)}if(showGrid){ctx.strokeStyle='#ffffff55';ctx.lineWidth=.7;for(let i=0;i<=N;i++){ctx.beginPath();ctx.moveTo(i*S,0);ctx.lineTo(i*S,768);ctx.moveTo(0,i*S);ctx.lineTo(768,i*S);ctx.stroke()}}}
c.addEventListener('click',e=>{let r=c.getBoundingClientRect(),x=Math.floor((e.clientX-r.left)/r.width*N),y=Math.floor((e.clientY-r.top)/r.height*N);if(x>=0&&x<N&&y>=0&&y<N){land[y][x]=!land[y][x];draw()}});document.querySelector('#random').onclick=random;document.querySelector('#reset').onclick=reset;document.querySelector('#grid').onclick=()=>{showGrid=!showGrid;draw()};grass.onload=draw;water.onload=draw;reset();
</script></body></html>
