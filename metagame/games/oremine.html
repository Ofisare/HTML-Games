<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Erzmine · Erzsortierung</title><style>*{box-sizing:border-box}body{margin:0;background:#112729;color:#eef4e8;font:16px system-ui,sans-serif;padding:18px;max-width:750px;margin:auto}header{display:flex;align-items:center;justify-content:space-between;gap:10px}h1{font-size:clamp(22px,5vw,31px)}button,a{font:inherit;touch-action:manipulation}button{background:#295d58;border:1px solid #80aaa0;color:white;border-radius:12px;padding:12px;cursor:pointer}button:disabled{opacity:.5}a{color:#b9e8cb}.stats{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.stats span{background:#234e4b;padding:9px;border-radius:9px}#board{display:grid;gap:5px;aspect-ratio:1;max-width:570px;margin:14px auto;touch-action:manipulation}#board button{min-width:0;min-height:0;padding:0;border:2px solid #536b67;border-radius:9px;font-size:clamp(19px,6vw,38px);display:grid;place-items:center;transition:transform .16s,background .16s}#board button.selected{outline:3px solid #fff3a0;transform:scale(.95)}#board button.open{background:#375d56}#board button.hidden{background:#374b49}#board button.matched{background:#9d8040}#board button:focus-visible{outline:3px solid white}#message{min-height:45px;line-height:1.5}#help{background:#1c3b3b;padding:14px;border-radius:12px;margin:12px 0}#help[hidden],#overlay[hidden]{display:none}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:15px}.actions a{display:inline-block;background:#295d58;border:1px solid #80aaa0;border-radius:12px;padding:12px;text-decoration:none;color:white}#overlay{position:fixed;inset:0;background:#061819d9;display:grid;place-items:center;padding:20px;z-index:9}#overlay article{background:#244e49;border:2px solid #8fb8a5;padding:28px;border-radius:18px;text-align:center;max-width:440px}#overlay a{display:inline-block;background:#34796a;padding:14px;border-radius:10px;text-decoration:none;color:white}.rock{display:inline-block;width:70%;aspect-ratio:1;clip-path:polygon(10% 65%,26% 24%,60% 8%,87% 28%,97% 70%,72% 94%,28% 90%);background:var(--rock);box-shadow:inset 8px 9px #ffffff44,inset -8px -9px #00000044;border:2px solid #28383a}.coal{--rock:#303a42}.ore{--rock:#438fc7}.gold{--rock:#e8b72c}</style></head><body><header><h1>Erzmine · Erzsortierung</h1><button id="helpBtn" aria-label="Spielhilfe ein- oder ausblenden" aria-expanded="false">❓</button></header><div class="stats"><span id="goal"></span><span id="level"></span><span id="reward"></span></div><div id="help" hidden>Tausche zwei benachbarte Steine durch Antippen. Drei oder mehr gleiche Farben in einer Reihe werden entfernt. Sammle genügend blaue Erze.</div><div id="board" aria-label="Spielfeld"></div><p id="message" aria-live="polite"></p><div class="actions"><button id="restart">🔄 Neues Rätsel</button><a href="../index.html">✖ Abbrechen – zur Insel</a></div><div id="overlay" hidden role="dialog" aria-modal="true"><article><h2>🎉 Geschafft!</h2><p id="winText"></p><a href="../index.html">🏝️ Zurück zur Insel</a><p><button id="again">Noch eine Runde</button></p></article></div><script>const KEY='enchanted-islands-v01',KIND='ore',REWARD=4,NAME='Erz';
const board=document.querySelector('#board'),msg=document.querySelector('#message'),overlay=document.querySelector('#overlay');
let wins=0;try{wins=Number(JSON.parse(localStorage.getItem(KEY))?.mineGameWins?.[KIND]||0)}catch{}
let level=Math.min(5,1+Math.floor(wins/3)),reward=REWARD+Math.floor(level/2),finished=false;
let help=localStorage.getItem('mine-help-'+KIND)!=='false';function renderHelp(){document.querySelector('#help').hidden=!help;document.querySelector('#helpBtn').setAttribute('aria-expanded',String(help))}renderHelp();document.querySelector('#helpBtn').onclick=()=>{help=!help;localStorage.setItem('mine-help-'+KIND,String(help));renderHelp()};
function saveReward(){let actual=0;try{let s=JSON.parse(localStorage.getItem(KEY));if(s?.version===1&&s.res){let cap=100+(s.buildings||[]).filter(b=>b.type==='warehouse'&&!b.buildEndsAt).reduce((n,b)=>n+[0,50,100,200][Math.max(1,Math.min(3,b.level||1))],0);actual=Math.max(0,Math.min(reward,cap-(Number(s.res[KIND])||0)));s.res[KIND]=(Number(s.res[KIND])||0)+actual;s.mineGameWins=s.mineGameWins||{};s.mineGameWins[KIND]=(Number(s.mineGameWins[KIND])||0)+1;localStorage.setItem(KEY,JSON.stringify(s))}}catch(e){msg.textContent='Speichern fehlgeschlagen: '+e.message}return actual}
function win(){if(finished)return;finished=true;let got=saveReward();document.querySelector('#winText').textContent='+'+got+' '+NAME+' ins Insellager geliefert'+(got<reward?' (Lager voll)':'')+'.';overlay.hidden=false;document.querySelector('#again').focus()}
document.querySelector('#restart').onclick=reset;document.querySelector('#again').onclick=()=>{location.reload()};document.querySelector('#reward').textContent='🎁 '+reward+' '+NAME;document.querySelector('#level').textContent='Stufe '+level;
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const N=7,EM=['🪨','🔷','⚫','🟡','💎'];let cells=[],selected=-1,found=0,target=9+level*3;
function matches(a){let out=new Set();for(let y=0;y<N;y++)for(let x=0;x<N;){let j=x+1;while(j<N&&a[y*N+j]===a[y*N+x])j++;if(j-x>=3)for(let k=x;k<j;k++)out.add(y*N+k);x=j}for(let x=0;x<N;x++)for(let y=0;y<N;){let j=y+1;while(j<N&&a[j*N+x]===a[y*N+x])j++;if(j-y>=3)for(let k=y;k<j;k++)out.add(k*N+x);y=j}return out}
function hasMove(){for(let i=0;i<N*N;i++)for(let j of [i+1,i+N]){if(j>=N*N||(j===i+1&&Math.floor(j/N)!==Math.floor(i/N)))continue;[cells[i],cells[j]]=[cells[j],cells[i]];let ok=matches(cells).size>0;[cells[i],cells[j]]=[cells[j],cells[i]];if(ok)return true}return false}
function fresh(){let a;do{a=Array.from({length:N*N},()=>Math.floor(Math.random()*5))}while(matches(a).size||!(()=>{cells=a;return hasMove()})());return a}
function reset(){finished=false;overlay.hidden=true;selected=-1;found=0;cells=fresh();render()}
function render(){board.style.gridTemplateColumns='repeat('+N+',1fr)';board.innerHTML='';cells.forEach((v,i)=>{let b=document.createElement('button');b.textContent=EM[v];b.classList.toggle('selected',selected===i);b.onclick=()=>tap(i);board.appendChild(b)});document.querySelector('#goal').textContent='🔷 '+found+' / '+target}
function tap(i){if(finished)return;if(selected<0){selected=i;render();return}let j=selected;selected=-1;if(i===j){render();return}if(Math.abs(i-j)!==N&&!(Math.abs(i-j)===1&&Math.floor(i/N)===Math.floor(j/N))){selected=i;render();return}[cells[i],cells[j]]=[cells[j],cells[i]];if(!matches(cells).size){[cells[i],cells[j]]=[cells[j],cells[i]];msg.textContent='Dieser Tausch ergibt keine Kombination.';render();return}let chain=0;while(matches(cells).size&&chain++<30){let hit=matches(cells);for(let k of hit){if(cells[k]===1)found++;cells[k]=-1}for(let x=0;x<N;x++){let col=[];for(let y=N-1;y>=0;y--)if(cells[y*N+x]>=0)col.push(cells[y*N+x]);for(let y=N-1;y>=0;y--)cells[y*N+x]=col[N-1-y]??Math.floor(Math.random()*5)}}msg.textContent='Erz gesammelt: '+found+' / '+target;if(found>=target){render();win();return}if(!hasMove())cells=fresh();render()}
reset();</script></body></html>
