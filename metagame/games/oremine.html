<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Erzmine · Erzsortierung</title><style>*{box-sizing:border-box}body{margin:0;background:#112729;color:#eef4e8;font:16px system-ui,sans-serif;padding:18px;max-width:750px;margin:auto}header{display:flex;align-items:center;justify-content:space-between;gap:10px}h1{font-size:clamp(22px,5vw,31px)}button,a{font:inherit;touch-action:manipulation}button{background:#295d58;border:1px solid #80aaa0;color:white;border-radius:12px;padding:12px;cursor:pointer}button:disabled{opacity:.5}a{color:#b9e8cb}.stats{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.stats span{background:#234e4b;padding:9px;border-radius:9px}#board{display:grid;gap:5px;aspect-ratio:1;max-width:570px;margin:14px auto;touch-action:none;user-select:none;-webkit-user-select:none}#board button{min-width:0;min-height:0;padding:0;border:2px solid #536b67;border-radius:9px;font-size:clamp(19px,6vw,38px);display:grid;place-items:center;transition:transform .16s,background .16s;touch-action:none;user-select:none;-webkit-user-select:none}#board button.selected{outline:3px solid #fff3a0;transform:scale(.95)}#board button.open{background:#375d56}#board button.hidden{background:#374b49}#board button.matched{background:#9d8040}#board button:focus-visible{outline:3px solid white}#message{min-height:45px;line-height:1.5}#help{background:#1c3b3b;padding:14px;border-radius:12px;margin:12px 0}#help[hidden],#overlay[hidden]{display:none}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:15px}.actions a{display:inline-block;background:#295d58;border:1px solid #80aaa0;border-radius:12px;padding:12px;text-decoration:none;color:white}#overlay{position:fixed;inset:0;background:#061819d9;display:grid;place-items:center;padding:20px;z-index:9}#overlay article{background:#244e49;border:2px solid #8fb8a5;padding:28px;border-radius:18px;text-align:center;max-width:440px}#overlay a{display:inline-block;background:#34796a;padding:14px;border-radius:10px;text-decoration:none;color:white}.rock{display:inline-block;width:70%;aspect-ratio:1;clip-path:polygon(10% 65%,26% 24%,60% 8%,87% 28%,97% 70%,72% 94%,28% 90%);background:var(--rock);box-shadow:inset 8px 9px #ffffff44,inset -8px -9px #00000044;border:2px solid #28383a}.ore-legend{display:inline-flex;width:38px;height:38px;vertical-align:middle;align-items:center;justify-content:center}.ore-legend svg{width:100%;height:100%}.coal{--rock:#303a42}.ore{--rock:#438fc7}.gold{--rock:#e8b72c}
/* Einheitliche kompakte Kopfzeile */
header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 10px}header h1{flex:1;min-width:0;font-size:clamp(18px,4.6vw,25px);line-height:1.2;margin:8px 0}.header-actions{display:flex;align-items:center;gap:7px;flex-shrink:0}.header-actions button,.header-actions .island-btn{box-sizing:border-box;display:grid;place-items:center;width:46px;height:46px;min-width:46px;min-height:46px;padding:0;margin:0;background:#32665f;color:white;border:1px solid #82a99d;border-radius:12px;text-decoration:none;font-size:24px;line-height:1;cursor:pointer}.header-actions .island-btn:focus-visible{outline:3px solid #fff}.actions:empty{display:none}

/* Statusleiste: nur die drei direkten Kinder als Kacheln gestalten.
   Das verschachtelte Erzsymbol darf weder Kachel-Padding noch Hintergrund erben. */
.stats{display:flex;align-items:center;gap:8px;flex-wrap:nowrap;margin:15px 0}
.stats>span{box-sizing:border-box;display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:48px;padding:9px 10px;white-space:nowrap;background:#234e4b;border-radius:9px;line-height:1.15}

</style><script>
/* Jede HTML-Datei prueft unabhaengig ihre Version; Spielstaende bleiben unberuehrt. */
(()=>{'use strict';
  const FILE="games/oremine.html", BUILD_VERSION="1.0.5";
  const IS_ISLAND=FILE==='index.html';
  const MANIFEST=IS_ISLAND?'version.json':'../version.json';
  const VALID=/^[a-zA-Z0-9._-]{1,48}$/;
  let checking=false;
  // Kompatibilitaet mit bisherigen Links, aber keine globale Version mehr anhaengen.
  window.islandVersionedUrl=input=>new URL(input,location.href).href;
  async function checkVersion(){
    if(checking||document.visibilityState==='hidden')return;
    checking=true;
    try{
      const response=await fetch(MANIFEST+'?check='+Date.now(),{cache:'no-store'});
      if(!response.ok)return;
      const data=await response.json();
      const published=data?.files?.[FILE];
      if(typeof published!=='string'||!VALID.test(published)||published===BUILD_VERSION)return;
      // Ein verzoegerter GitHub-Pages-Deploy darf keine Reload-Schleife erzeugen.
      const key='island-file-update:'+FILE+':'+published;
      const last=Number(sessionStorage.getItem(key)||0);
      if(Date.now()-last<30000)return;
      sessionStorage.setItem(key,String(Date.now()));
      const url=new URL(location.href);
      url.searchParams.delete('v'); // alten globalen Parameter entfernen
      url.searchParams.set('update',published);
      location.replace(url.href);
    }catch(e){/* Offline: aktuelle Seite weiternutzen. */}
    finally{checking=false;}
  }
  // Jedes Spiel prueft beim Start, nicht mitten in einer laufenden Runde.
  checkVersion();
  if(IS_ISLAND){
    window.addEventListener('pageshow',()=>checkVersion());
    document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')checkVersion()});
    setInterval(checkVersion,60000);
  }
})();
</script>
</head><body><header><h1>Erzmine · Erzsortierung</h1><div class="header-actions"><button id="helpBtn" aria-label="Spielhilfe ein- oder ausblenden" aria-expanded="false">❓</button><a class="island-btn" href="../index.html" aria-label="Zur Insel" title="Zur Insel">🏝️</a></div></header><div class="stats"><span id="goal"></span><span id="level"></span><span id="reward"></span></div><div id="help" hidden>Ziehe einen Stein auf ein benachbartes Feld, um beide zu tauschen. Alternativ kannst du zwei Felder nacheinander antippen. Drei oder mehr gleiche Farben in einer Reihe werden entfernt. Sammle genügend blaue Erze.</div><div id="board" aria-label="Spielfeld"></div><p id="message" aria-live="polite"></p><div class="actions"></div><div id="overlay" hidden role="dialog" aria-modal="true"><article><h2>🎉 Geschafft!</h2><p id="winText"></p><a href="../index.html">🏝️ Zurück zur Insel</a><p><button id="again">Noch eine Runde</button></p></article></div><script>const KEY='enchanted-islands-v01',KIND='ore',REWARD=4,NAME='Erz';
const board=document.querySelector('#board'),msg=document.querySelector('#message'),overlay=document.querySelector('#overlay');
let wins=0;try{wins=Number(JSON.parse(localStorage.getItem(KEY))?.mineGameWins?.[KIND]||0)}catch{}
let level=Math.min(5,1+Math.floor(wins/3)),reward=REWARD+Math.floor(level/2),finished=false;
let help=localStorage.getItem('mine-help-'+KIND)!=='false';function renderHelp(){document.querySelector('#help').hidden=!help;document.querySelector('#helpBtn').setAttribute('aria-expanded',String(help))}renderHelp();document.querySelector('#helpBtn').onclick=()=>{help=!help;localStorage.setItem('mine-help-'+KIND,String(help));renderHelp()};
function saveReward(){let actual=0;try{let s=JSON.parse(localStorage.getItem(KEY));if(s?.version===1&&s.res){let cap=100+(s.buildings||[]).filter(b=>b.type==='warehouse'&&!b.buildEndsAt).reduce((n,b)=>n+[0,50,100,200][Math.max(1,Math.min(3,b.level||1))],0);actual=Math.max(0,Math.min(reward,cap-(Number(s.res[KIND])||0)));s.res[KIND]=(Number(s.res[KIND])||0)+actual;s.mineGameWins=s.mineGameWins||{};s.mineGameWins[KIND]=(Number(s.mineGameWins[KIND])||0)+1;localStorage.setItem(KEY,JSON.stringify(s))}}catch(e){msg.textContent='Speichern fehlgeschlagen: '+e.message}return actual}
function win(){if(finished)return;finished=true;let got=saveReward();document.querySelector('#winText').textContent='+'+got+' '+NAME+' ins Insellager geliefert'+(got<reward?' (Lager voll)':'')+'.';overlay.hidden=false;document.querySelector('#again').focus()}
document.querySelector('#again').onclick=()=>{location.reload()};document.querySelector('#reward').innerHTML='<span class="ore-legend">'+oreSvg()+'</span> '+reward+' '+NAME;document.querySelector('#level').textContent='Stufe '+level;
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const N=7,EM=['🪨','🔷','⚫','🟡','💎'];
// Identische Gesteinsform wie rockSvg('ore') auf der Insel.
function oreSvg(){return `<svg aria-hidden="true" viewBox="0 0 64 64" width="80%" height="80%"><path d="M6 42 17 20 37 9 53 21 59 44 43 57 18 55Z" fill="#438fc7" stroke="#26313a" stroke-width="3" stroke-linejoin="round"/><path d="M17 20 30 29 37 9 53 21 44 34 59 44 43 57 30 42 18 55 6 42 30 29" fill="none" stroke="#25313a" stroke-opacity=".55" stroke-width="2"/><path d="M17 20 37 9 30 29 6 42Z" fill="#fff" opacity=".24"/><path d="M30 29 44 34 43 57 30 42 18 55 6 42Z" fill="#000" opacity=".16"/></svg>`}
let cells=[],selected=-1,found=0,target=9+level*3;const COLORS=5;
let falling=false;
function animateGravity(origins,oldCells){
  render();
  const nodes=[...board.children],height=board.getBoundingClientRect().height/N;
  const animations=[];
  nodes.forEach((node,i)=>{
    const from=origins[i];
    if(from===i)return;
    const y=Math.floor(i/N),fromY=from===null?-1-Math.floor(i/N)%3:Math.floor(from/N);
    const distance=(fromY-y)*height;
    animations.push(node.animate([{transform:`translateY(${distance}px)`,opacity:from===null?0.5:1},{transform:'translateY(0)',opacity:1}],{duration:390+Math.max(0,y-fromY)*25,easing:'cubic-bezier(.2,.7,.3,1)',fill:'both'}).finished.catch(()=>{}));
  });
  return Promise.all(animations);
}
// Animate the two actual stones before applying the swap to the game state.
async function animateSwap(i,j){
  const a=board.children[i],b=board.children[j];
  if(!a||!b)return;
  const ar=a.getBoundingClientRect(),br=b.getBoundingClientRect();
  const dx=br.left-ar.left,dy=br.top-ar.top;
  const opts={duration:230,easing:'ease-in-out',fill:'both'};
  await Promise.all([
    a.animate([{transform:'translate(0,0)'},{transform:`translate(${dx}px,${dy}px)`}],opts).finished.catch(()=>{}),
    b.animate([{transform:'translate(0,0)'},{transform:`translate(${-dx}px,${-dy}px)`}],opts).finished.catch(()=>{})
  ]);
}
function collapseWithOrigins(){
  let origins=Array(N*N).fill(null);
  for(let x=0;x<N;x++){
    let col=[];
    for(let y=N-1;y>=0;y--)if(cells[y*N+x]>=0)col.push({value:cells[y*N+x],from:y*N+x});
    for(let y=N-1;y>=0;y--){let item=col[N-1-y];cells[y*N+x]=item?.value??Math.floor(Math.random()*COLORS);origins[y*N+x]=item?.from??null}
  }
  return origins;
}

function matches(a){let out=new Set();for(let y=0;y<N;y++)for(let x=0;x<N;){let j=x+1;while(j<N&&a[y*N+j]===a[y*N+x])j++;if(j-x>=3)for(let k=x;k<j;k++)out.add(y*N+k);x=j}for(let x=0;x<N;x++)for(let y=0;y<N;){let j=y+1;while(j<N&&a[j*N+x]===a[y*N+x])j++;if(j-y>=3)for(let k=y;k<j;k++)out.add(k*N+x);y=j}return out}
function hasMove(){for(let i=0;i<N*N;i++)for(let j of [i+1,i+N]){if(j>=N*N||(j===i+1&&Math.floor(j/N)!==Math.floor(i/N)))continue;[cells[i],cells[j]]=[cells[j],cells[i]];let ok=matches(cells).size>0;[cells[i],cells[j]]=[cells[j],cells[i]];if(ok)return true}return false}
function fresh(){let a;do{a=Array.from({length:N*N},()=>Math.floor(Math.random()*5))}while(matches(a).size||!(()=>{cells=a;return hasMove()})());return a}
function reset(){falling=false;finished=false;overlay.hidden=true;selected=-1;found=0;cells=fresh();render()}
function render(){board.style.gridTemplateColumns='repeat('+N+',1fr)';board.innerHTML='';cells.forEach((v,i)=>{let b=document.createElement('button');if(v===1)b.innerHTML=oreSvg();else b.textContent=EM[v];b.dataset.index=i;b.classList.toggle('selected',selected===i);board.appendChild(b)});document.querySelector('#goal').textContent='Erz '+found+' / '+target}
async function tap(i){
 if(finished||falling)return;
 if(selected<0){selected=i;render();return}
 let j=selected;selected=-1;
 if(i===j){render();return}
 if(Math.abs(i-j)!==N&&!(Math.abs(i-j)===1&&Math.floor(i/N)===Math.floor(j/N))){selected=i;render();return}
 falling=true;
 // The stones move first, then the board is redrawn. Invalid swaps also visibly return.
 await animateSwap(i,j);
 [cells[i],cells[j]]=[cells[j],cells[i]];
 if(!matches(cells).size){
   render();await animateSwap(i,j);
   [cells[i],cells[j]]=[cells[j],cells[i]];
   msg.textContent='Dieser Tausch ergibt keine Kombination.';
   falling=false;render();return;
 }
 render();
 let chain=0;
 while(matches(cells).size&&chain++<30){
   let hit=matches(cells);
   for(let k of hit){if(cells[k]===1)found++;cells[k]=-1}
   let origins=collapseWithOrigins();await animateGravity(origins);
 }
 falling=false;msg.textContent='Erz gesammelt: '+found+' / '+target;
 if(found>=target){render();win();return}
 if(!hasMove())cells=fresh();render();
}
let pointerStart=null;
board.addEventListener('pointerdown',e=>{
 const el=e.target.closest('button[data-index]');if(!el||finished||falling)return;
 pointerStart={id:e.pointerId,index:Number(el.dataset.index),x:e.clientX,y:e.clientY};
 board.setPointerCapture(e.pointerId);
});
board.addEventListener('pointerup',e=>{
 if(!pointerStart||e.pointerId!==pointerStart.id)return;
 const start=pointerStart;pointerStart=null;
 if(finished||falling)return;
 const dx=e.clientX-start.x,dy=e.clientY-start.y;
 const cell=board.getBoundingClientRect().width/N;
 // A deliberate swipe moves exactly one field in its dominant direction.
 if(Math.max(Math.abs(dx),Math.abs(dy))>=Math.max(14,cell*.22)){
   const x=start.index%N,y=Math.floor(start.index/N);
   const nx=x+(Math.abs(dx)>Math.abs(dy)?Math.sign(dx):0);
   const ny=y+(Math.abs(dy)>=Math.abs(dx)?Math.sign(dy):0);
   if(nx<0||nx>=N||ny<0||ny>=N)return;
   selected=start.index;tap(ny*N+nx);
 }else tap(start.index);
});
board.addEventListener('pointercancel',()=>{pointerStart=null});
reset();</script></body></html>
