<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Rechentrainer</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#203047;background:#f3f7ff}*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:flex;justify-content:center}.wrap{width:min(100%,520px);padding:18px 18px 32px}header{display:flex;justify-content:space-between;align-items:center;gap:10px}a{color:#315bb4;text-decoration:none;font-weight:650}.panel{background:white;border-radius:24px;box-shadow:0 8px 30px #20304712;padding:22px;margin-top:18px;text-align:center}.difficulty{display:flex;gap:7px;margin:18px 0 0}.difficulty button{flex:1;border:2px solid #d6dfef;border-radius:12px;padding:11px 4px;background:#f8fafc;color:#344565;font-weight:700;cursor:pointer}.difficulty button.active{background:#315bb4;border-color:#315bb4;color:white}.top{display:flex;justify-content:space-between;gap:10px;color:#64748b;font-size:15px}.problem{font-size:clamp(44px,12vw,66px);font-weight:800;margin:30px 0 16px;white-space:nowrap}.answer{min-height:68px;border:3px solid #cbd5e1;border-radius:16px;display:grid;place-items:center;font-size:42px;font-weight:750;margin:0 auto 18px;max-width:190px;background:#f8fafc}.answer.good{border-color:#25a66a;background:#e9fff1}.answer.bad{border-color:#dc2626;background:#fff0f0;animation:shake .2s}.top .streak-warning{color:#dc2626;font-weight:800}.msg.warning{color:#dc2626}.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.pad button{border:0;border-radius:15px;background:#e8efff;color:#233f80;font-size:28px;font-weight:750;min-height:67px;touch-action:manipulation;cursor:pointer}.pad button:active{transform:scale(.96)}.pad .del{background:#ffeddf;color:#a64e1a}.pad .skip{background:#dff5ed;color:#17694a;font-size:19px}.msg{min-height:28px;font-size:16px;font-weight:650;color:#65758a;margin:12px 0 0}.controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}.controls button{background:#fff;border:1px solid #d6dfef;border-radius:12px;padding:12px 16px;font-weight:650;color:#344565}.hint{color:#65758a;font-size:13px;text-align:center;line-height:1.5;margin-top:18px}@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
</style></head><body><main class="wrap"><header><a href="../index.html">← Alle Spiele</a><strong>🧮 Rechentrainer</strong></header><section class="panel"><div class="difficulty" aria-label="Schwierigkeit"><button type="button" data-level="easy" class="active" aria-pressed="true">Einfach</button><button type="button" data-level="medium" aria-pressed="false">Mittel</button><button type="button" data-level="hard" aria-pressed="false">Schwer</button></div><p id="levelhint" class="hint" style="margin:8px 0 18px">Zahlen bis 10</p><div class="top"><span id="count">Richtig: 0</span><span id="streak">Serie: 0 ⭐</span></div><div id="problem" class="problem" aria-live="polite"></div><div id="answer" class="answer" aria-label="Deine Antwort">?</div><div class="pad" id="pad"><button data-key="1">1</button><button data-key="2">2</button><button data-key="3">3</button><button data-key="4">4</button><button data-key="5">5</button><button data-key="6">6</button><button data-key="7">7</button><button data-key="8">8</button><button data-key="9">9</button><button data-key="del" class="del" aria-label="Löschen">⌫</button><button data-key="0">0</button><button data-key="skip" class="skip">Weiter →</button></div><p id="msg" class="msg" aria-live="polite">Tippe deine Lösung ein.</p></section><div class="controls"><button id="restart">↻ Neu starten</button></div><p class="hint">Plus und Minus · Die gesuchte Zahl kann überall stehen · Keine negativen Ergebnisse · Bei richtiger Antwort geht es automatisch weiter.</p></main><script>
(()=>{
const $=id=>document.getElementById(id);
let task=null,input='',correct=0,streak=0,last='',timer=null,locked=false,level='easy',consecutiveErrors=0;
const descriptions={easy:'Zahlen bis 10',medium:'Bis 20 · ohne Zehnerübergang',hard:'Bis 20 · mit Zehnerübergang'};
function random(n){return Math.floor(Math.random()*n)}
function makeTask(){let a,b,op,result,key;for(let tries=0;tries<500;tries++){
 op=random(2)?'+':'−';
 if(level==='easy'){if(op==='+'){a=random(11);b=random(11-a)}else{a=random(11);b=random(a+1)}}
 else if(level==='medium'){
  if(op==='+'){a=random(21);b=random(21-a)}else{a=random(21);b=random(a+1)}
  if(op==='+'&&a%10+b%10>=10)continue;
  if(op==='−'&&a%10<b%10)continue;
 }else{
  if(op==='+'){a=1+random(19);b=1+random(20-a);if(a%10+b%10<10)continue}
  else{a=10+random(10);b=1+random(a);if(a%10>=b%10)continue}
 }
 result=op==='+'?a+b:a-b;const missing=random(3);key=`${a}${op}${b}:${missing}`;
 if(key!==last){last=key;return {a,b,op,result,missing,solution:[a,b,result][missing]}}
 }
 return {a:5,b:3,op:'+',result:8,missing:2,solution:8};
}
function next(){clearTimeout(timer);timer=null;locked=false;input='';$('answer').className='answer';$('answer').textContent='?';$('msg').classList.remove('warning');$('msg').textContent='Tippe deine Lösung ein.';task=makeTask();$('problem').textContent=`${task.missing===0?'?':task.a} ${task.op} ${task.missing===1?'?':task.b} = ${task.missing===2?'?':task.result}`;updateStats()}
function updateStats(){$('count').textContent=`Richtig: ${correct}`;$('streak').textContent=`Serie: ${streak} ⭐${consecutiveErrors===1?' ⚠️':''}`;$('streak').classList.toggle('streak-warning',consecutiveErrors===1)}
function press(key){if(locked)return;
 if(key==='skip'){streak=0;consecutiveErrors=0;next();return}
 if(key==='del'){clearTimeout(timer);timer=null;input=input.slice(0,-1);$('answer').textContent=input||'?';$('answer').className='answer';$('msg').textContent=consecutiveErrors===1?'Achtung: Noch ein Fehler beendet deine Serie!':'Tippe deine Lösung ein.';$('msg').classList.toggle('warning',consecutiveErrors===1);return}
 if(!/^\d$/.test(key)||input.length>=2)return;
 clearTimeout(timer);timer=null;input+=key;$('answer').textContent=input;$('answer').className='answer';const n=Number(input);
 if(n===task.solution){locked=true;correct++;streak++;consecutiveErrors=0;$('answer').classList.add('good');$('msg').textContent='Super! ✓';updateStats();timer=setTimeout(next,650)}
 else if(input.length===2||n>task.solution||task.solution===0){consecutiveErrors++;if(consecutiveErrors>=2){streak=0;consecutiveErrors=0;}$('msg').classList.toggle('warning',consecutiveErrors===1);updateStats();$('answer').classList.add('bad');$('msg').textContent=consecutiveErrors===1?'⚠️ Achtung! Noch ein Fehler und deine Sterneserie ist weg.':'Zwei Fehler hintereinander – die Serie beginnt neu.';timer=setTimeout(()=>{input='';$('answer').textContent='?';$('answer').className='answer';timer=null},650)}
}
$('pad').addEventListener('click',e=>{const b=e.target.closest('button[data-key]');if(b)press(b.dataset.key)});
document.addEventListener('keydown',e=>{if(e.key>='0'&&e.key<='9')press(e.key);else if(e.key==='Backspace')press('del');else if(e.key==='Enter')press('skip')});
$('restart').addEventListener('click',()=>{correct=0;streak=0;consecutiveErrors=0;last='';next()});
document.querySelectorAll('[data-level]').forEach(button=>button.addEventListener('click',()=>{
 level=button.dataset.level;correct=0;streak=0;consecutiveErrors=0;last='';$('levelhint').textContent=descriptions[level];
 document.querySelectorAll('[data-level]').forEach(b=>{const selected=b===button;b.classList.toggle('active',selected);b.setAttribute('aria-pressed',String(selected))});next();
}));next();
})();
</script></body></html>
