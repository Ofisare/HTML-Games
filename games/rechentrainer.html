<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Rechentrainer bis 20</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#203047;background:#f3f7ff}*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:flex;justify-content:center}.wrap{width:min(100%,520px);padding:18px 18px 32px}header{display:flex;justify-content:space-between;align-items:center;gap:10px}a{color:#315bb4;text-decoration:none;font-weight:650}.panel{background:white;border-radius:24px;box-shadow:0 8px 30px #20304712;padding:22px;margin-top:18px;text-align:center}.top{display:flex;justify-content:space-between;gap:10px;color:#64748b;font-size:15px}.problem{font-size:clamp(44px,12vw,66px);font-weight:800;margin:30px 0 16px;white-space:nowrap}.answer{min-height:68px;border:3px solid #cbd5e1;border-radius:16px;display:grid;place-items:center;font-size:42px;font-weight:750;margin:0 auto 18px;max-width:190px;background:#f8fafc}.answer.good{border-color:#25a66a;background:#e9fff1}.answer.bad{border-color:#f59e0b;animation:shake .2s}.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.pad button{border:0;border-radius:15px;background:#e8efff;color:#233f80;font-size:28px;font-weight:750;min-height:67px;touch-action:manipulation;cursor:pointer}.pad button:active{transform:scale(.96)}.pad .del{background:#ffeddf;color:#a64e1a}.pad .skip{background:#dff5ed;color:#17694a;font-size:19px}.msg{min-height:28px;font-size:16px;font-weight:650;color:#65758a;margin:12px 0 0}.controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}.controls button{background:#fff;border:1px solid #d6dfef;border-radius:12px;padding:12px 16px;font-weight:650;color:#344565}.hint{color:#65758a;font-size:13px;text-align:center;line-height:1.5;margin-top:18px}@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
</style></head><body><main class="wrap"><header><a href="../index.html">← Alle Spiele</a><strong>🧮 Rechentrainer</strong></header><section class="panel"><div class="top"><span id="count">Richtig: 0</span><span id="streak">Serie: 0 ⭐</span></div><div id="problem" class="problem" aria-live="polite"></div><div id="answer" class="answer" aria-label="Deine Antwort">?</div><div class="pad" id="pad"><button data-key="1">1</button><button data-key="2">2</button><button data-key="3">3</button><button data-key="4">4</button><button data-key="5">5</button><button data-key="6">6</button><button data-key="7">7</button><button data-key="8">8</button><button data-key="9">9</button><button data-key="del" class="del" aria-label="Löschen">⌫</button><button data-key="0">0</button><button data-key="skip" class="skip">Weiter →</button></div><p id="msg" class="msg" aria-live="polite">Tippe deine Lösung ein.</p></section><div class="controls"><button id="restart">↻ Neu starten</button></div><p class="hint">Plus und Minus bis 20 · Keine negativen Ergebnisse · Bei richtiger Antwort geht es automatisch weiter.</p></main><script>
(()=>{const $=id=>document.getElementById(id);let task=null,input='',correct=0,streak=0,last='',timer=null,locked=false;function random(n){return Math.floor(Math.random()*n)}function next(){clearTimeout(timer);locked=false;input='';$('answer').className='answer';$('answer').textContent='?';$('msg').textContent='Tippe deine Lösung ein.';let a,b,op,key;do{op=random(2)?'+':'−';if(op==='+'){a=random(21);b=random(21-a)}else{a=random(21);b=random(a+1)}key=`${a}${op}${b}`}while(key===last);last=key;task={a,b,op,result:op==='+'?a+b:a-b};$('problem').textContent=`${a} ${op} ${b} = ?`;$('count').textContent=`Richtig: ${correct}`;$('streak').textContent=`Serie: ${streak} ⭐`}
function press(key){if(locked)return;if(key==='skip'){streak=0;next();return}if(key==='del'){input=input.slice(0,-1);$('answer').textContent=input||'?';$('answer').className='answer';$('msg').textContent='Tippe deine Lösung ein.';return}if(!/^\d$/.test(key)||input.length>=2)return;input+=key;$('answer').textContent=input;$('answer').className='answer';const n=Number(input);if(n===task.result){locked=true;correct++;streak++;$('answer').classList.add('good');$('msg').textContent='Super! ✓';$('count').textContent=`Richtig: ${correct}`;$('streak').textContent=`Serie: ${streak} ⭐`;timer=setTimeout(next,650)}else if(input.length===2||n>task.result||task.result===0){streak=0;$('streak').textContent='Serie: 0 ⭐';$('answer').classList.add('bad');$('msg').textContent='Versuch es noch einmal!';timer=setTimeout(()=>{input='';$('answer').textContent='?';$('answer').className='answer'},650)}}
$('pad').addEventListener('click',e=>{const b=e.target.closest('button[data-key]');if(b)press(b.dataset.key)});document.addEventListener('keydown',e=>{if(e.key>='0'&&e.key<='9')press(e.key);else if(e.key==='Backspace')press('del');else if(e.key==='Enter')press('skip')});$('restart').addEventListener('click',()=>{correct=0;streak=0;next()});next()})();
</script></body></html>
